; ============================================================
;  keymap.ini  —  可选。只写你想"覆盖/新增/禁用"的项即可。
;  不存在本文件或本段为空时,使用 ice.dll 内置的默认映射。
;
;  格式:   PC按键 = 键编号k          (k 见 ANALYSIS.md 键位表,0..56)
;          k = -1 表示禁用该 PC 按键(让它恢复原有行为)
;
;  PC按键写法:
;    单个字符     A..Z  0..9  + - * / ( ) = . , ^   (按"键入的字符"匹配,已考虑 Shift)
;    命名按键     ENTER BACK ESC DEL UP DOWN LEFT RIGHT TAB SPACE DECIMAL
;                 HOME END PGUP PGDN F1..F12
;    符号别名     EQUALS PLUS MINUS STAR SLASH DOT COMMA CARET LPAREN RPAREN
;  Ctrl / Alt 组合键永远放行(不会被映射)。
;
;  示例(去掉行首分号即生效):
;[Keymap]
;ESC = -1        ; 让 Esc 恢复原行为(关闭窗口),不再当作 ON/C
;J   = 5         ; J 键 -> ")"
;F9  = 0         ; F9 键 -> MODE
; ============================================================
[Keymap]

; ------------------------------------------------------------
;  键帽角标(按键提示):在每个键帽右下角用黄色小字标出对应的电脑键名。
;  提示文字由上面的映射自动反推(字母优先,其次 F 键 / Esc / Bksp ...),
;  所以改了键位,提示会自动跟着变。默认不标数字、运算符、方向键(显而易见)。
;
;[Hints]
;Show    = 1        ; 0 = 完全关闭角标
;ShowAll = 0        ; 1 = 数字、运算符、方向键、Enter 也标出
;Scale   = 38       ; 字高占键帽高度的百分比(10..60),字太小就调大
;Color   = FFD600   ; 文字颜色 RRGGBB(默认黄色)
;Edge    = 202020   ; 描边颜色 RRGGBB
;Text50  = Tab      ; 单独指定第 k 号键的提示文字;写成 "Text10 =" (留空)则隐藏该键提示
; ------------------------------------------------------------

; ------------------------------------------------------------
;  剪贴板
;  Ctrl+V          粘贴:把剪贴板里的"纯数字/小数"按键输入到计算器(模拟逐个按键)
;  Esc             粘贴/采集进行中按 Esc 可中止
;  Ctrl+Alt+K      采集:自动在计算器上输入几组数字并记录内部状态到 ice_probe.txt
;                  (用于开发"复制到剪贴板",见 README)
;  Ctrl+Alt+D      手动快照:把当前 LCD 点阵和内部 RAM 追加写入 ice_probe.txt
;
;[Clipboard]
;Paste         = 1    ; 0 = 关闭 Ctrl+V 粘贴(Ctrl+V 恢复原样放行)
;MaxLen        = 32   ; 允许粘贴的最大字符数(数字 + 小数点)
;AllowNegative = 0    ; 1 = 允许开头一个 "-"(会先按 (-) 键)
;HoldMs        = 80   ; 每个键按住的毫秒数;粘贴时丢数字/重复数字就调大
;GapMs         = 80   ; 两个键之间的间隔毫秒数
;SettleMs      = 400  ; 采集时每步之后等待计算器稳定的毫秒数
; ------------------------------------------------------------

